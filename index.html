  :root {
    --accent: #0397D6;
    --accent-dark: #0272A4;
    --ink: #111111;
    --gray: #5B6470;
    --line: #E3E7EC;
    --bg: #F6F8FA;
    --surface: #FFFFFF;
    --red: #C0392B;
    --amber: #B45309;
    --green: #1E7B34;
    --radius: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Gotham', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  header.site { background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-inner {
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .site-inner img { height: 44px; width: auto; }
  .site-lockup { line-height: 0.95; }
  .lock-line { font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 19px; color: var(--ink); }
  .lock-line.blue { color: var(--accent); }
  .site-sub {
    color: var(--gray); font-size: 13px; line-height: 1.35; max-width: 210px;
    border-left: 1px solid var(--line); padding-left: 14px; margin-left: 2px;
  }
  .userbox { text-align: right; font-size: 13.5px; color: var(--gray); }
  .userbox b { color: var(--ink); }
  .userbox button {
    background: none; border: none; color: var(--accent-dark);
    cursor: pointer; text-decoration: underline; padding: 0; font-size: 13.5px;
  }
  main { padding: 14px 20px 40px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .chips, .viewtoggle { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .chip, .viewtoggle button { border: none; background: none; color: var(--gray); padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .chip + .chip, .viewtoggle button + button { border-left: 1px solid var(--line); }
  .chip.active, .viewtoggle button.active { background: var(--ink); color: #fff; }
  .chip:hover:not(.active), .viewtoggle button:hover:not(.active) { background: var(--bg); }
  .toolbar select, .toolbar input[type=search] {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    padding: 8px 10px; font-size: 14px; color: var(--ink);
  }
  .toolbar input[type=search] { min-width: 220px; }
  .btn-new {
    margin-left: auto; background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 10px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-new:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  .banner-error {
    border: 1px solid #E5C0BA; background: #FBEFED; color: var(--red);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: 14px;
  }
  .banner-note {
    border: 1px solid #E8D5AE; background: #FBF4E1; color: var(--amber);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: 14px;
  }

  .board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; background: var(--surface); z-index: 1;
    text-align: left; font-size: 13px; font-weight: 700; color: var(--gray);
    padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #F3F9FD; }
  tbody tr.done-row td { color: var(--gray); }
  tbody tr.done-row td.proj { font-weight: 500; }
  tbody tr.unassigned-row td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
  .btn-claim {
    border: 1px solid var(--accent); color: var(--accent-dark); background: var(--surface);
    border-radius: var(--radius); padding: 3px 10px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-claim:hover { background: #F3F9FD; }
  tbody tr.rush-row td:first-child { box-shadow: inset 3px 0 0 var(--red); }
  .rush-tag {
    color: var(--red); border: 1px solid var(--red); border-radius: var(--radius);
    font-size: 12px; font-weight: 700; padding: 1px 7px; margin-right: 8px;
  }
  .cmt { color: var(--gray); font-weight: 400; font-size: 13px; }
  .overdue-count { color: var(--red); font-weight: 700; font-size: 14px; padding: 0 4px; }
  .comments { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .comments-title { font-size: 13px; font-weight: 700; color: var(--gray); margin-bottom: 8px; }
  .comments-empty { color: var(--gray); font-size: 13.5px; }
  .comment { margin-bottom: 10px; }
  .comment-meta { font-size: 12.5px; color: var(--gray); margin-bottom: 2px; }
  .comment-text { font-size: 14.5px; white-space: pre-wrap; }
  .comment-add { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
  .comment-add textarea {
    flex: 1; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 10px; font-size: 14px; min-height: 44px; resize: vertical;
  }
  td.proj { max-width: 460px; font-weight: 700; }
  td.dim2 { color: var(--gray); max-width: 230px; }
  td.due { font-variant-numeric: tabular-nums; }
  .ovd { color: var(--red); font-weight: 700; }
  select.status {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);

  .overlay {

  .field label .req { color: var(--red); }
  .field input[type=text], .field input[type=date], .field select, .field textarea {

  .field textarea { min-height: 120px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: 1px solid var(--accent); border-color: var(--accent);

  .two-col { display: flex; gap: 10px; }
  .two-col .field { flex: 1; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .btn {
    border-radius: var(--radius); padding: 9px 16px; font-size: 14px; font-weight: 700; cursor: pointer;

  }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.danger { color: var(--red); border-color: #E5C0BA; margin-right: auto; }
  .form-error { color: var(--red); font-size: 14px; margin-top: 6px; }
  .form-intro { color: var(--gray); font-size: 13.5px; margin: -8px 0 14px; }
  .checks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 14px; }

  .check input { accent-color: var(--accent); width: 15px; height: 15px; }
  .field input[type=file] { font-size: 13.5px; }
  .file-list { list-style: none; margin-top: 6px; }
  .file-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 9px; margin-bottom: 4px; font-size: 13.5px; }
  .file-list button { border: none; background: none; color: var(--red); cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }
  .form-note { color: var(--gray); font-size: 12.5px; margin-top: 6px; }
  .file-row { margin-bottom: 5px; white-space: normal; }
  .file-link {
    border: none; background: none; color: var(--accent-dark); text-decoration: underline;
    cursor: pointer; padding: 0; font-size: 14px; text-align: left;

  .detail-grid { display: grid; grid-template-columns: 135px 1fr; row-gap: 10px; column-gap: 14px; font-size: 14.5px; }
  .detail-grid dt { color: var(--gray); font-size: 13px; font-weight: 700; padding-top: 1px; }

  .status-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0 2px; }

    padding: 9px 8px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--gray);
  }
  .status-btn:hover { background: var(--bg); }
  .status-btn.active.s0, .status-btn.active.s3, .status-btn.active.s5 { background: #4A5460; border-color: #4A5460; color: #fff; }
  .status-btn.active.s1 { background: var(--amber); border-color: var(--amber); color: #fff; }
  .status-btn.active.s2 { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .status-btn.active.s4 { background: var(--green); border-color: var(--green); color: #fff; }
  .meta-line { color: var(--gray); font-size: 13px; margin-top: 12px; }

  .picker { max-width: 420px; }
  .picker h2 { margin-bottom: 4px; }

  .names button {
    border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
    padding: 11px 8px; font-size: 14.5px; font-weight: 500; cursor: pointer;
  }
  .names button:hover { border-color: var(--accent); background: #F3F9FD; }

  .cal-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .btn.nav { padding: 6px 12px; }
  .cal-label { font-size: 17px; font-weight: 700; margin: 0 auto 0 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-grid.cal-dow { border-bottom: 1px solid var(--line); }
  .dow-cell { padding: 8px 10px; font-size: 13px; color: var(--gray); font-weight: 700; }
  .cal-cell { padding: 6px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 0; }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-grid.month .cal-cell { min-height: 116px; }
  .cal-grid.week .cal-cell { min-height: 250px; }
  .cal-cell.dim { background: #FAFBFC; }
  .cal-cell.dim .cal-daynum { color: #B9C0C9; }
  .cal-cell.today { background: #F3F9FD; }
  .cal-daynum { display: inline-block; font-size: 13.5px; font-weight: 700; color: var(--gray); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
  .cal-daynum.today { color: var(--ink); }
  .cal-chip {
    display: block; width: 100%; text-align: left;
    border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--radius);
    background: var(--surface); padding: 5px 8px; margin-bottom: 4px;

    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

  .cal-chip:hover { background: var(--bg); }

  @media (max-width: 720px) {

    main { padding: 10px 10px 40px; }
    .hide-sm { display: none; }
    .btn-new { padding: 8px 12px; font-size: 14px; }
    .names { grid-template-columns: repeat(2, 1fr); }
    .cal-grid.month .cal-cell { min-height: 56px; padding: 3px; }
    .cal-chip { font-size: 10px; padding: 2px 4px; }
    .cal-label { font-size: 12.5px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const PEOPLE = ['Alicia', 'Amelia', 'Antoinette', 'Bobbi', 'Colleen', 'Courtney', 'Hillary', 'Michelle', 'Nate', 'Rachel', 'Sydney'];
const BRANDS = ['Athletic Turf', 'Golfdom', 'GPS World', 'Landscape Management', 'LP Gas',
  'Pest Management Professional', 'Pit & Quarry', 'Portable Plants', 'North Coast Media (corporate)', 'Multiple brands'];
const TYPES = ['PDF promo', 'HTML promo', 'Print promo', 'House eblast', 'House ad (include ad size in description)',
  'Proposal', 'Advertiser/spec ad', 'Client mockup', 'Web ads', 'Social ads', 'Booth graphics', 'E-books', 'Other'];
const STATUSES = ['Not started', 'In progress', 'Out for review', 'On hold', 'Done', 'Canceled'];
// Done and Canceled are the closed states: they sink to the bottom, archive after 90 days
// and lose their files 48 hours after closing.
function isClosed(order) { return order.status === 'Done' || order.status === 'Canceled'; }

// Shared live storage for the whole team.
const firebaseConfig = {
  apiKey: "AIzaSyCHfowgcEaB7r9Vre4VO2JMctFeJ-Cq8tg",
  authDomain: "ncm-marketing-projects.firebaseapp.com",
  databaseURL: "https://ncm-marketing-projects-default-rtdb.firebaseio.com",
  projectId: "ncm-marketing-projects",
  storageBucket: "ncm-marketing-projects.firebasestorage.app",
  messagingSenderId: "691711988178",
  appId: "1:691711988178:web:1d90776d82d2e34528f80b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// Realtime Database keys cannot contain . # $ [ ] /
function safeId(id) { return String(id).replace(/[.#$\[\]\/]/g, '-'); }

// Done orders move to the Archived view three months after completion.
const ARCHIVE_MS = 90 * 24 * 60 * 60 * 1000;
function isArchived(order) {
  return isClosed(order) && Date.now() - Date.parse(order.doneAt || order.updatedAt) > ARCHIVE_MS;
}
const USER_KEY = 'ncm_mktg_user_v1';

// Files on Done orders are removed 48 hours after completion so storage never accumulates.
// Runs on every snapshot; the writes are idempotent (once purged, nothing left to purge).
const PURGE_MS = 48 * 60 * 60 * 1000;
function purgeDoneFiles(orders) {
  const now = Date.now();
  orders.forEach(o => {
    const doneSince = isClosed(o) ? Date.parse(o.doneAt || o.updatedAt) : null;
    if (doneSince && now - doneSince > PURGE_MS && (o.attachments || []).length > 0) {
      (o.attachments || []).forEach(a => { if (a.fileId) db.ref('files/' + a.fileId).remove().catch(() => {}); });
      db.ref('orders/' + safeId(o.id)).update({ attachments: null, attachmentsPurged: true }).catch(() => {});
    }
  });
}

const AP_MONTHS = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
const MONTHS_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function toISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseDay(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(iso) {
  if (!iso) return '';
  const dt = parseDay(iso);
  return AP_MONTHS[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear();
}
function isOverdue(order) {
  if (!order.dueDate || isClosed(order)) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return parseDay(order.dueDate) < today;
}
function orderTypes(order) {
  return order.types || (order.type ? [order.type] : []);
}
function typeLabel(order) {
  return orderTypes(order)
    .map(t => t === 'Other' && order.typeOther ? 'Other: ' + order.typeOther : t)
    .join(', ');
}
// Compact form for the table: first type plus a count, so long lists never widen the row.
function typeLabelShort(order) {
  const types = orderTypes(order);
  if (!types.length) return '';
  const first = types[0] === 'Other' && order.typeOther ? 'Other: ' + order.typeOther : types[0];
  return types.length > 1 ? first + ' +' + (types.length - 1) : first;
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return Math.round(bytes / 1024) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}
function statusClass(status) { return 's' + STATUSES.indexOf(status); }
function assigneesOf(order) {
  return order.assignees || (order.assignedTo ? [order.assignedTo] : []);
}

function NamePicker({ onPick }) {
  return (
    <div className="overlay">
      <div className="modal picker">
        <h2>Who are you?</h2>
        <p>Pick your name. Work orders you submit are attributed to you.</p>
        <div className="names">
          {PEOPLE.map(p => <button key={p} onClick={() => onPick(p)}>{p}</button>)}
        </div>
      </div>
    </div>
  );
}

function OrderForm({ user, initial, prefill, onSave, onCancel }) {
  const blank = {
    name: user, brand: '', projectName: '', description: '', types: [], typeOther: '',
    dueDate: '', assignees: [], attachments: [], rush: false
  };
  const [form, setForm] = useState(() => {
    if (initial) return {
      ...blank, ...initial,
      types: orderTypes(initial),
      assignees: assigneesOf(initial),
      attachments: initial.attachments || []
    };
    // Duplicating: carry over the what and who, reset dates, files, rush and requester.
    if (prefill) return {
      ...blank,
      brand: prefill.brand || '', projectName: prefill.projectName || '', description: prefill.description || '',
      types: orderTypes(prefill), typeOther: prefill.typeOther || '',
      assignees: assigneesOf(prefill)
    };
    return blank;
  });
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const toggleType = (t) => {
    setForm(f => ({ ...f, types: f.types.includes(t) ? f.types.filter(x => x !== t) : [...f.types, t] }));
  };
  const toggleAssignee = (p) => {
    setForm(f => ({ ...f, assignees: f.assignees.includes(p) ? f.assignees.filter(x => x !== p) : [...f.assignees, p] }));
  };
  const MAX_FILE_BYTES = 10 * 1024 * 1024;
  const addFiles = (e) => {
    const chosen = Array.from(e.target.files);
    e.target.value = '';
    const tooBig = chosen.filter(fl => fl.size > MAX_FILE_BYTES);
    if (tooBig.length) {
      setError('Files over 10MB are not supported: ' + tooBig.map(fl => fl.name).join(', ') + '. Compress or split them, then attach again.');
    } else {
      setError('');
    }
    const ok = chosen.filter(fl => fl.size <= MAX_FILE_BYTES);
    if (!ok.length) return;
    Promise.all(ok.map(fl => new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => res({ name: fl.name, size: fl.size, mime: fl.type || 'application/octet-stream', dataB64: String(rd.result).split(',')[1] || '' });
      rd.onerror = () => rej(rd.error);
      rd.readAsDataURL(fl);
    }))).then(read => {
      setForm(f => ({ ...f, attachments: [...f.attachments, ...read].slice(0, 4) }));
    }).catch(() => setError('A file could not be read. Attach it again.'));
  };
  const removeFile = (i) => {
    setForm(f => ({ ...f, attachments: f.attachments.filter((x, idx) => idx !== i) }));
  };

  const submit = () => {
    if (!form.name || !form.brand || !form.projectName.trim() || !form.description.trim() || form.types.length === 0 || !form.dueDate) {
      setError('Fill in every required field, including at least one project type.'); return;
    }
    if (form.types.includes('Other') && !form.typeOther.trim()) {
      setError('Specify the project type under "If other".'); return;
    }
    const clean = { ...form };
    delete clean.type;
    delete clean.assignedTo;
    setSaving(true);
    Promise.resolve(onSave(clean)).catch(() => setSaving(false));
  };

  return (
    <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal">
        <h2>{initial ? 'Edit work order' : 'New work order'}</h2>
        <p className="form-intro">Fill in the categories below so the project matches your requirements.</p>
        <div className="two-col">
          <div className="field">
            <label>Your name <span className="req">*</span></label>
            <select value={form.name} onChange={e => set('name', e.target.value)}>
              {PEOPLE.map(p => <option key={p}>{p}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Brand <span className="req">*</span></label>
            <select value={form.brand} onChange={e => set('brand', e.target.value)}>
              <option value="">Select a brand</option>
              {BRANDS.map(b => <option key={b}>{b}</option>)}
            </select>
          </div>
        </div>
        <div className="field">
          <label>Project name <span className="req">*</span></label>
          <input type="text" maxLength={120} value={form.projectName} onChange={e => set('projectName', e.target.value)} placeholder="Short, specific title" />
        </div>
        <div className="field">
          <label>Project description <span className="req">*</span></label>
          <textarea maxLength={5000} value={form.description} onChange={e => set('description', e.target.value)} placeholder="What is needed, specs, links, sizes, where it runs" />
        </div>
        <div className="field">
          <label>Project type <span className="req">*</span> (check all that apply)</label>
          <div className="checks">
            {TYPES.map(t => (
              <label key={t} className="check">
                <input type="checkbox" checked={form.types.includes(t)} onChange={() => toggleType(t)} />
                {t}
              </label>
            ))}
          </div>
        </div>
        {form.types.includes('Other') && (
          <div className="field">
            <label>If other, please specify <span className="req">*</span></label>
            <input type="text" maxLength={100} value={form.typeOther} onChange={e => set('typeOther', e.target.value)} />
          </div>
        )}
        <div className="field">
          <label>Assign to (optional, check everyone involved)</label>
          <div className="checks people">
            {PEOPLE.map(p => (
              <label key={p} className="check">
                <input type="checkbox" checked={form.assignees.includes(p)} onChange={() => toggleAssignee(p)} />
                {p}
              </label>
            ))}
          </div>
        </div>
        <div className="field">
          <label>Final due date <span className="req">*</span></label>
          <input type="date" value={form.dueDate} onChange={e => set('dueDate', e.target.value)} />
        </div>
        <div className="field">
          <label className="check">
            <input type="checkbox" checked={!!form.rush} onChange={e => set('rush', e.target.checked)} />
            Rush (goes to the top of the list)
          </label>
        </div>
        <div className="field">
          <label>Attach files (up to 4)</label>
          {form.attachments.length < 4 && <input type="file" multiple onChange={addFiles} />}
          {form.attachments.length > 0 && (
            <ul className="file-list">
              {form.attachments.map((a, i) => (
                <li key={i}>
                  <span>{a.name} ({fmtSize(a.size)})</span>
                  <button type="button" onClick={() => removeFile(i)}>Remove</button>
                </li>
              ))}
            </ul>
          )}
          <div className="form-note">Up to 4 files, 10MB each. Anyone on the team can view and download them from the order. Files are removed automatically two days after a project is marked done or canceled.</div>
        </div>
        {error && <div className="form-error">{error}</div>}
        <div className="modal-actions">
          <button className="btn" onClick={onCancel}>Cancel</button>
          <button className="btn primary" disabled={saving} onClick={submit}>{saving ? 'Saving…' : (initial ? 'Save changes' : 'Submit work order')}</button>
        </div>
      </div>
    </div>
  );
}

function OrderDetail({ order, onStatus, onClaim, onComment, onEdit, onDuplicate, onDelete, onClose, fetchFile }) {
  const [draft, setDraft] = useState('');
  const [fileBusy, setFileBusy] = useState('');
  const openFile = (att, download) => {
    setFileBusy(att.fileId + (download ? ':d' : ':v'));
    fetchFile(att).then(blob => {
      const url = URL.createObjectURL(blob);
      if (download) {
        const a = document.createElement('a');
        a.href = url; a.download = att.name; a.click();
      } else {
        window.open(url, '_blank');
      }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }).catch(e => {
      window.alert('The file could not be loaded. It may have been removed. Reload the page and try again. ' + ((e && e.message) || ''));
    }).then(() => setFileBusy(''));
  };
  const postComment = () => { if (draft.trim()) { onComment(draft); setDraft(''); } };
  return (
    <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <h2>{order.projectName}</h2>
        <dl className="detail-grid">
          {order.rush && (
            <React.Fragment>
              <dt>Priority</dt><dd className="ovd">Rush</dd>
            </React.Fragment>
          )}
          <dt>Brand</dt><dd>{order.brand}</dd>
          <dt>Project type</dt><dd>{typeLabel(order)}</dd>
          <dt>Requested by</dt><dd>{order.name}</dd>
          <dt>Assigned to</dt>
          <dd>{assigneesOf(order).length ? assigneesOf(order).join(', ') : <button className="btn-claim" onClick={onClaim}>Claim</button>}</dd>
          <dt>Final due date</dt><dd className={isOverdue(order) ? 'ovd' : ''}>{fmtDate(order.dueDate)}{isOverdue(order) ? ' (overdue)' : ''}</dd>
          {(order.attachments || []).length > 0 && (
            <React.Fragment>
              <dt>Files</dt>
              <dd>
                {order.attachments.map((a, i) => (
                  <div key={i} className="file-row">
                    {a.fileId ? (
                      <React.Fragment>
                        <button className="file-link" onClick={() => openFile(a, false)}>
                          {fileBusy === a.fileId + ':v' ? 'Loading…' : a.name}
                        </button>
                        <span className="file-size"> ({fmtSize(a.size)}) </span>
                        <button className="file-link" onClick={() => openFile(a, true)}>
                          {fileBusy === a.fileId + ':d' ? 'Loading…' : 'Download'}
                        </button>
                      </React.Fragment>
                    ) : (
                      <span>{a.name} ({fmtSize(a.size)}) · name only, recorded before uploads were enabled</span>
                    )}
                  </div>
                ))}
              </dd>
            </React.Fragment>
          )}
          {(order.attachments || []).length === 0 && order.attachmentsPurged && (
            <React.Fragment>
              <dt>Files</dt>
              <dd>Removed automatically two days after the project was marked done or canceled.</dd>
            </React.Fragment>
          )}
          <dt>Description</dt><dd>{order.description}</dd>
        </dl>
        <div className="status-row">
          {STATUSES.map(s => (
            <button key={s}
              className={'status-btn ' + statusClass(s) + (order.status === s ? ' active' : '')}
              onClick={() => onStatus(s)}>{s}</button>
          ))}
        </div>
        <div className="meta-line">
          Submitted {fmtDate((order.createdAt || '').slice(0, 10))} · Last updated {fmtDate((order.updatedAt || '').slice(0, 10))}
        </div>
        <div className="comments">
          <div className="comments-title">Comments</div>
          {(order.comments || []).length === 0 && (
            <div className="comments-empty">No comments yet. Add specs, links or questions here.</div>
          )}
          {(order.comments || []).map((c, i) => (
            <div key={i} className="comment">
              <div className="comment-meta">{c.by} · {fmtDate(c.at.slice(0, 10))}</div>
              <div className="comment-text">{c.text}</div>
            </div>
          ))}
          <div className="comment-add">
            <textarea maxLength={2000} value={draft} onChange={e => setDraft(e.target.value)} placeholder="Write a comment" />
            <button className="btn" onClick={postComment}>Add comment</button>
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn danger" onClick={onDelete}>Delete</button>
          <button className="btn" onClick={onDuplicate}>Duplicate</button>
          <button className="btn" onClick={onEdit}>Edit</button>
          <button className="btn primary" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

function Calendar({ mode, cursorDate, orders, onNav, onToday, onOpen }) {
  const byDay = {};
  orders.forEach(o => { if (o.dueDate) (byDay[o.dueDate] = byDay[o.dueDate] || []).push(o); });
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  let start, end, label;
  if (mode === 'month') {
    const first = new Date(cursorDate.getFullYear(), cursorDate.getMonth(), 1);
    const last = new Date(cursorDate.getFullYear(), cursorDate.getMonth() + 1, 0);
    start = new Date(first); start.setDate(first.getDate() - first.getDay());
    end = new Date(last); end.setDate(last.getDate() + (6 - last.getDay()));
    label = MONTHS_FULL[cursorDate.getMonth()] + ' ' + cursorDate.getFullYear();
  } else {
    start = new Date(cursorDate); start.setDate(cursorDate.getDate() - cursorDate.getDay());
    end = new Date(start); end.setDate(start.getDate() + 6);
    label = AP_MONTHS[start.getMonth()] + ' ' + start.getDate() + '-' +
      (end.getMonth() === start.getMonth() ? '' : AP_MONTHS[end.getMonth()] + ' ') + end.getDate() + ', ' + end.getFullYear();
  }
  const days = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) days.push(new Date(d));
  return (
    <div className="board">
      <div className="cal-head">
        <button className="btn nav" onClick={() => onNav(-1)} aria-label="Previous">‹</button>
        <button className="btn nav" onClick={() => onNav(1)} aria-label="Next">›</button>
        <div className="cal-label">{label}</div>
        <button className="btn" onClick={onToday}>Today</button>
      </div>
      <div className="cal-grid cal-dow">
        {DOW.map(d => <div key={d} className="dow-cell">{d}</div>)}
      </div>
      <div className={'cal-grid ' + mode}>
        {days.map(d => {
          const iso = toISO(d);
          const dayOrders = byDay[iso] || [];
          const isToday = d.getTime() === today.getTime();
          const dim = mode === 'month' && d.getMonth() !== cursorDate.getMonth();
          return (
            <div key={iso} className={'cal-cell' + (isToday ? ' today' : '') + (dim ? ' dim' : '')}>
              <span className={'cal-daynum' + (isToday ? ' today' : '')}>{d.getDate()}</span>
              {dayOrders.map(o => (
                <button key={o.id} className={'cal-chip ' + statusClass(o.status) + (o.rush && !isClosed(o) ? ' rush' : '')} title={o.projectName} onClick={() => onOpen(o.id)}>
                  {o.projectName}
                  {mode === 'week' && <span className="chip-sub">{o.brand} · {assigneesOf(o).length ? assigneesOf(o).join(', ') : 'Unassigned'}</span>}
                </button>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [orders, setOrders] = useState([]);
  const [synced, setSynced] = useState(false);
  const [syncError, setSyncError] = useState('');
  const [lastBackup, setLastBackup] = useState(undefined);
  const [user, setUser] = useState(() => localStorage.getItem(USER_KEY) || '');
  const [statusFilter, setStatusFilter] = useState('All');
  const [brandFilter, setBrandFilter] = useState('');
  const [meOnly, setMeOnly] = useState(false);
  const [search, setSearch] = useState('');
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [prefill, setPrefill] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [view, setView] = useState('list');
  const [cursor, setCursor] = useState(() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); });

  // Live subscription: the shared board is the source of truth for every tab and machine.
  // Subscribe only AFTER anonymous sign-in completes: a read that arrives before auth is
  // ready gets permission_denied and Firebase permanently cancels that listener.
  // Anonymous sign-in is the database key, not anyone's identity. Firebase auto-deletes
  // these accounts after 30 days; the auth listener silently creates a fresh one and
  // re-subscribes whenever that happens.
  useEffect(() => {
    const ref = db.ref('orders');
    let attached = false;
    const onValue = (snap) => {
      const list = Object.values(snap.val() || {});
      setOrders(list);
      setSynced(true);
      setSyncError('');
      purgeDoneFiles(list);
    };
    const onError = (err) => {
      attached = false;
      setSynced(true);
      setSyncError((err && err.message) || String(err));
    };
    const unsubAuth = firebase.auth().onAuthStateChanged(u => {
      if (!u) {
        firebase.auth().signInAnonymously().catch(e => {
          setSynced(true);
          setSyncError('Could not sign in to the shared board. ' + ((e && e.message) || ''));
        });
        return;
      }
      if (!attached) {
        attached = true;
        ref.on('value', onValue, onError);
        db.ref('meta/lastBackup').on('value', s => setLastBackup(s.val() || null), () => {});
      }
    });
    return () => { unsubAuth(); ref.off('value', onValue); db.ref('meta/lastBackup').off(); };
  }, []);

  const writeOrder = (order) => {
    db.ref('orders/' + safeId(order.id)).set(JSON.parse(JSON.stringify(order)))
      .catch(e => setSyncError('Could not save. ' + ((e && e.message) || '')));
  };

  const navCal = (dir) => {
    const d = new Date(cursor);
    if (view === 'month') { d.setDate(1); d.setMonth(d.getMonth() + dir); }
    else d.setDate(d.getDate() + dir * 7);
    setCursor(d.getTime());
  };
  const goToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); setCursor(d.getTime()); };

  const pickUser = (name) => { localStorage.setItem(USER_KEY, name); setUser(name); };

  // New attachments arrive from the form with their contents (dataB64); store each under
  // files/<fileId> so the board listener never downloads file bytes, only metadata.
  const storeNewFiles = async (orderId, attachments) => {
    const out = [];
    for (const a of (attachments || [])) {
      if (a.dataB64 != null) {
        const fileId = 'f-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        await db.ref('files/' + fileId).set({
          name: a.name, mime: a.mime || 'application/octet-stream', orderId: orderId,
          uploadedAt: new Date().toISOString(), data: a.dataB64
        });
        out.push({ name: a.name, size: a.size, mime: a.mime || 'application/octet-stream', fileId: fileId });
      } else {
        out.push(a);
      }
    }
    return out;
  };

  const upsert = async (form) => {
    const now = new Date().toISOString();
    try {
      if (editing) {
        const current = orders.find(o => o.id === editing.id) || editing;
        const atts = await storeNewFiles(current.id, form.attachments);
        const keptIds = new Set(atts.map(a => a.fileId).filter(Boolean));
        for (const a of (current.attachments || [])) {
          if (a.fileId && !keptIds.has(a.fileId)) await db.ref('files/' + a.fileId).remove();
        }
        writeOrder({ ...current, ...form, attachments: atts, updatedAt: now });
      } else {
        const id = 'wo-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
        const atts = await storeNewFiles(id, form.attachments);
        writeOrder({ ...form, id: id, attachments: atts, status: 'Not started', createdAt: now, updatedAt: now });
      }
    } catch (e) {
      setSyncError('Could not save the files. ' + ((e && e.message) || ''));
    }
    setShowForm(false); setEditing(null); setPrefill(null);
  };

  const fetchFile = async (att) => {
    const snap = await db.ref('files/' + att.fileId).once('value');
    const f = snap.val();
    if (!f || !f.data) throw new Error('The file is no longer stored.');
    const bytes = atob(f.data);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    return new Blob([arr], { type: f.mime || att.mime || 'application/octet-stream' });
  };

  const setStatus = (id, status) => {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const next = { ...o, status, updatedAt: new Date().toISOString() };
    if (status === 'Done' || status === 'Canceled') { if (!next.doneAt) next.doneAt = next.updatedAt; }
    else delete next.doneAt;
    writeOrder(next);
  };

  const claim = (id) => {
    const target = orders.find(o => o.id === id);
    if (!target || assigneesOf(target).length) return;
    const next = { ...target, assignees: [user], updatedAt: new Date().toISOString() };
    delete next.assignedTo;
    writeOrder(next);
  };

  const addComment = (id, text) => {
    const t = text.trim();
    if (!t) return;
    const o = orders.find(x => x.id === id);
    if (!o) return;
    writeOrder({
      ...o,
      comments: [...(o.comments || []), { by: user, at: new Date().toISOString(), text: t }],
      updatedAt: new Date().toISOString()
    });
  };

  const exportCsv = () => {
    const esc = v => {
      let s = String(v == null ? '' : v).replace(/\r?\n+/g, '; ');
      // Excel treats leading = + - @ as a formula; prefix with ' so exported cells stay text.
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    };
    const rows = [['Project', 'Types', 'Brand', 'Requested by', 'Assigned to', 'Due date', 'Status', 'Rush', 'Submitted', 'Description']];
    visible.forEach(o => rows.push([
      o.projectName, typeLabel(o), o.brand, o.name, assigneesOf(o).join('; '), o.dueDate || '', o.status,
      o.rush ? 'Yes' : 'No', (o.createdAt || '').slice(0, 10), o.description
    ]));
    const csv = rows.map(r => r.map(esc).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'marketing-projects-' + toISO(new Date()) + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    // A full export (All view, no filters) counts as the monthly backup for the whole team.
    if (statusFilter === 'All' && !brandFilter && !search && !meOnly) {
      db.ref('meta/lastBackup').set(new Date().toISOString()).catch(() => {});
    }
  };

  const remove = (id) => {
    if (!window.confirm('Are you sure? This permanently deletes the work order, its comments and its files for the whole team. This cannot be undone.')) return;
    const o = orders.find(x => x.id === id);
    ((o && o.attachments) || []).forEach(a => { if (a.fileId) db.ref('files/' + a.fileId).remove().catch(() => {}); });
    db.ref('orders/' + safeId(id)).remove().catch(e => setSyncError('Could not delete. ' + ((e && e.message) || '')));
    setDetailId(null);
  };

  const counts = { All: orders.filter(o => !isArchived(o)).length };
  STATUSES.forEach(s => { counts[s] = orders.filter(o => o.status === s && !isArchived(o)).length; });
  counts.Archived = orders.filter(isArchived).length;
  const overdueCount = orders.filter(isOverdue).length;
  const BACKUP_DUE_MS = 30 * 24 * 60 * 60 * 1000;
  const backupDue = synced && orders.length > 0 && lastBackup !== undefined &&
    (!lastBackup || Date.now() - Date.parse(lastBackup) > BACKUP_DUE_MS);

  let visible = orders.filter(o =>
    (statusFilter === 'Archived' ? isArchived(o) : (!isArchived(o) && (statusFilter === 'All' || o.status === statusFilter))) &&
    (!brandFilter || o.brand === brandFilter) &&
    (!meOnly || o.name === user || assigneesOf(o).includes(user) || assigneesOf(o).length === 0) &&
    (!search || ((o.projectName || '') + ' ' + (o.description || '') + ' ' + (o.brand || '') + ' ' + typeLabel(o)).toLowerCase().includes(search.toLowerCase()))
  );
  // Rush first, then unassigned active work so it gets claimed, then assigned active work, Done last.
  const rank = o => isClosed(o) ? 3 : (o.rush ? 0 : (assigneesOf(o).length ? 2 : 1));
  visible = visible.slice().sort((a, b) => {
    if (rank(a) !== rank(b)) return rank(a) - rank(b);
    return (a.dueDate || '9999').localeCompare(b.dueDate || '9999');
  });

  const detail = orders.find(o => o.id === detailId);

      <main>
        {syncError && (
          <div className="banner-error">
            Not connected to the shared board: {syncError} Changes made now will not save.
            Check the internet connection and reload; tell Nate if it keeps happening.
          </div>
        )}
        {backupDue && !syncError && (
          <div className="banner-note">
            Monthly backup due. Select All with no filters and click Export CSV, then save the file.
          </div>
        )}
        <div className="toolbar">
          <div className="chips">
            {['All', ...STATUSES, 'Archived'].map(s => (
              <button key={s} className={'chip' + (statusFilter === s ? ' active' : '')} onClick={() => setStatusFilter(s)}>
                {s} ({counts[s]})
              </button>
            ))}
          </div>
          {overdueCount > 0 && <div className="overdue-count">{overdueCount} overdue</div>}
          <select value={brandFilter} onChange={e => setBrandFilter(e.target.value)}>
            <option value="">All brands</option>
            {BRANDS.map(b => <option key={b}>{b}</option>)}
          </select>
          <div className="viewtoggle">
            <button className={!meOnly ? 'active' : ''} onClick={() => setMeOnly(false)}>Everyone</button>
            <button className={meOnly ? 'active' : ''} onClick={() => setMeOnly(true)}>Me</button>
          </div>
          <input type="search" placeholder="Search projects" value={search} onChange={e => setSearch(e.target.value)} />
          <div className="viewtoggle">
            {[['list', 'List'], ['month', 'Month'], ['week', 'Week']].map(([v, lbl]) => (
              <button key={v} className={view === v ? 'active' : ''} onClick={() => { setView(v); if (v !== 'list') goToday(); }}>{lbl}</button>
            ))}
          </div>
          <button className="btn" onClick={exportCsv}>Export CSV</button>
        </div>

        {view === 'list' && <div className="board">
          <table>
            <thead>
              <tr>
                <th>Project</th>
                <th className="hide-sm">Type</th>
                <th className="hide-sm">Brand</th>
                <th className="hide-sm">Requested by</th>
                <th className="hide-sm">Assigned to</th>
                <th>Due date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {!synced && (
                <tr><td colSpan="7" className="empty">Loading work orders from the shared board…</td></tr>
              )}
              {synced && visible.length === 0 && (
                <tr><td colSpan="7" className="empty">
                  {orders.length === 0
                    ? 'No work orders yet. Select + New work order to submit the first one.'
                    : statusFilter === 'Archived'
                      ? 'No archived work orders. Done and canceled orders move here three months after they close.'
                      : 'No work orders match these filters. Clear a filter or adjust the search.'}
                </td></tr>
              )}
              {visible.map(o => (
                <tr key={o.id} className={isClosed(o) ? 'done-row' : (o.rush ? 'rush-row' : (assigneesOf(o).length === 0 ? 'unassigned-row' : ''))} onClick={() => setDetailId(o.id)}>
                  <td className="proj">
                    {o.rush && o.status !== 'Done' && <span className="rush-tag">Rush</span>}
                    {o.projectName}
                    {(o.comments || []).length > 0 && (
                      <span className="cmt"> · {o.comments.length} {o.comments.length === 1 ? 'comment' : 'comments'}</span>
                    )}
                  </td>
                  <td className="hide-sm dim2" title={typeLabel(o)}>{typeLabelShort(o)}</td>
                  <td className="hide-sm">{o.brand}</td>
                  <td className="hide-sm">{o.name}</td>
                  <td className="hide-sm">
                    {assigneesOf(o).length ? assigneesOf(o).join(', ') : (
                      <button className="btn-claim" onClick={e => { e.stopPropagation(); claim(o.id); }}>Claim</button>
                    )}
                  </td>
                  <td className="due">
                    {fmtDate(o.dueDate)}
                    {isOverdue(o) && <span className="ovd"> · overdue</span>}
                  </td>
                  <td onClick={e => e.stopPropagation()}>
                    <select className={'status ' + statusClass(o.status)} value={o.status} onChange={e => setStatus(o.id, e.target.value)}>
                      {STATUSES.map(s => <option key={s}>{s}</option>)}
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>}
        {view !== 'list' && (
          <Calendar mode={view} cursorDate={new Date(cursor)} orders={visible}
            onNav={navCal} onToday={goToday} onOpen={setDetailId} />
        )}
      </main>

      {!user && <NamePicker onPick={pickUser} />}
      {showForm && (
        <OrderForm user={user} initial={editing} prefill={prefill}
          onSave={upsert}
          onCancel={() => { setShowForm(false); setEditing(null); setPrefill(null); }} />
      )}
      {detail && !showForm && (
        <OrderDetail order={detail} fetchFile={fetchFile}
          onStatus={s => setStatus(detail.id, s)}
          onClaim={() => claim(detail.id)}
          onComment={t => addComment(detail.id, t)}
          onEdit={() => { setEditing(detail); setDetailId(null); setShowForm(true); }}
          onDuplicate={() => { setPrefill({ ...detail }); setEditing(null); setDetailId(null); setShowForm(true); }}
          onDelete={() => remove(detail.id)}
          onClose={() => setDetailId(null)} />
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
